<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Events Portal</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="navbar">
    <a class="event-portal" href="officer-login.html">
      <span class="event-portal-logo">
        <img src="images/EP.png" alt="Events Portal logo">
      </span>
      <span>Events Portal</span>
    </a>

    <nav class="nav-links">
      <a href="#home">HOME</a>
      <a href="#announcements">ANNOUNCEMENTS</a>
      <a href="#events">EVENTS</a>
      <a href="officer-login.html">OFFICER</a>
    </nav>

    <a class="nav-login" href="student-login.html">Log in</a>
  </header>

  <main>
    <div class="content">
      <div class="logo">
        <img src="images/SMCL.png" alt="Saint Michael's College of Laguna logo">
      </div>

      <h2>STUDENT LOGIN</h2>

      <form action="#" method="post">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username"
            required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password"
            autocomplete="current-password" required>
        </div>

        <button type="submit" class="submit">LOG IN</button>
        <a class="forgot-password" href="forgot-password.html">Forgot Password?</a>
      </form>
    </div>
  </main>

  <footer></footer>
</body>

</html>
