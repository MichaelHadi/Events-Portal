<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Events Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar navbar--event-portal-centered">
    <a class="event-portal" href="index.html">
      <span class="event-portal-logo">
        <img src="images/EP.png" alt="Events Portal logo">
      </span>
      <span>Events Portal</span>
    </a>
  </header>

  <main>
    <div class="content">
      <h1>FORGOT PASSWORD</h1>
      <p class="page-message">
        Enter the email address linked to your account to change your password.
      </p>

      <form action="reset-email-sent.html" method="get">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
        </div>
        <button type="submit" class="submit">SEND RESET LINK</button>
        <a class="forgot-password" href="index.html">Back to login</a>
      </form>
    </div>
  </main>

  <footer></footer>
</body>
</html>
