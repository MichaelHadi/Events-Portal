<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officers Page | Events Portal</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="navbar">
    <a class="brand">
      <span class="brand-logo">
        <img src="images/EP.png" alt="Events Portal logo">
      </span>
      <span>Events Portal</span>
    </a>

    <nav class="nav-links">
      <a>HOME</a>
      <a>ANNOUNCEMENTS</a>
      <a>EVENTS</a>
      <a class="active" aria-current="page">OFFICER</a>
    </nav>

    <button class="nav-login" type="button">Log in</button>
  </header>

  <main>
    <div class="content">

      <h1>OFFICERS PAGE</h1>

      <div class="logo">
        <img src="images/CSS.png" alt="DEPARTMENT LOGO">
      </div>

      <h2>OFFICER LOGIN</h2>

      <form action="#" method="post">

        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username"
                 placeholder="Enter username" autocomplete="username" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 placeholder="Enter password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="submit">LOG IN</button>
        <a class="forgot-password" href="forgot-password.html">Forgot Password?</a>

      </form>
    </div>
  </main>

  <footer></footer>

</body>
</html>
