<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Officer Login | Events Portal</title>
  <link rel="stylesheet" href="css/styles3.css">
  <link rel="icon" type="image/png" href="assets/dcs-logo.png">
</head>

<body>
  <header class="navbar navbar--site">
    <div class="header-logo">
      <img src="assets/dcs-logo.png" alt="DCS Logo">
      <h2>Events Portal</h2>
    </div>

    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="announcements.html">Announcements</a>
      <a class="active" aria-current="page" href="officer-login.html">Officer</a>
    </nav>

    <a href="student-login.html" class="login-link">Log in</a>
  </header>

  <main>
    <div class="content">
      <div class="logo">
        <img src="assets/CSS.png" alt="Department of Computer Studies logo">
      </div>

      <h2>OFFICER LOGIN</h2>

      <form action="#" method="post"
        onsubmit="window.location.href='officer-dashboard.html'; return false;">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username"
            required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password"
            autocomplete="current-password" required>
        </div>

        <button type="submit" class="submit">LOG IN</button>
        <a class="forgot-password" href="forgot-password.html">Forgot Password?</a>
      </form>
    </div>
  </main>

  <footer class="main-footer">
    <p>© 2026 Events Portal. All Rights Reserved.</p>
  </footer>
</body>

</html>
